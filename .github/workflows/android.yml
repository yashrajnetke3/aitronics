name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - run: gradle :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AITRONICS-debug
          path: app/build/outputs/apk/debug/*.apk


      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise commands on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.modelSmoke=${{ contains(github.event.head_commit.message, '[model-check]') }}
            adb pull /data/local/tmp/aitronics-wake.png assistant-wake.png
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.aitronics.assistant/.MainActivity
            sleep 2
            adb exec-out screencap -p > assistant-home.png
      - name: Check voice routing and permission feedback on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.aitronics.assistant.AssistantTest#bundledSpeechModelRoutesAudio,com.aitronics.assistant.AssistantTest#unavailableAppsAndDeniedAccessibilityHaveVisibleReplies,com.aitronics.assistant.AssistantTest#openCameraReachesAnInstalledCameraOrExplainsItsAbsence"
      - name: Save tested home screen
        uses: actions/upload-artifact@v4
        with:
          name: AITRONICS-screen
          path: |
            assistant-home.png
            assistant-wake.png
      - name: Show failing device assertions
        if: failure()
        run: |
          python3 - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              for failure in ET.parse(report).iter("failure"):
                  print((failure.text or failure.get("message", ""))[:6000])
          PYTEST

      - name: Check release signing configuration
        if: success() && github.ref == 'refs/heads/main'
        id: signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.AITRONICS_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.AITRONICS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AITRONICS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AITRONICS_KEY_PASSWORD }}
        run: |
          count=0
          for setting in KEYSTORE STORE_PASS KEY_ALIAS KEY_PASS; do
            if [[ -n "${!setting}" ]]; then count=$((count + 1)); fi
          done
          case "$count" in
            0) echo 'ready=false' >> "$GITHUB_OUTPUT" ;;
            4) echo 'ready=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Incomplete release signing configuration"; exit 1 ;;
          esac

      - name: Assemble unsigned release
        if: steps.signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease :app:lintRelease

      - name: Sign and verify release APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.AITRONICS_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.AITRONICS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AITRONICS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AITRONICS_KEY_PASSWORD }}
        run: |
          umask 077
          store=$(mktemp)
          trap 'rm -f "$store"' EXIT
          echo -n "$KEYSTORE" | base64 --decode > "$store"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$store" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out AITRONICS.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs AITRONICS.apk
          sha256sum AITRONICS.apk > AITRONICS.apk.sha256

      - name: Save signed release
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AITRONICS-release
          path: |
            AITRONICS.apk
            AITRONICS.apk.sha256
