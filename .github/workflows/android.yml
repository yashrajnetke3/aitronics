name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - run: gradle :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AITRONICS-debug
          path: app/build/outputs/apk/debug/*.apk


      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise commands on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.modelSmoke=${{ contains(github.event.head_commit.message, '[model-check]') }}
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.aitronics.assistant/.MainActivity
            sleep 2
            adb exec-out screencap -p > assistant-home.png
      - name: Save tested home screen
        uses: actions/upload-artifact@v4
        with:
          name: AITRONICS-screen
          path: assistant-home.png
      - name: Show failing device assertions
        if: failure()
        run: |
          python3 - <<'PYTEST'
          import pathlib
          import xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              for failure in ET.parse(report).iter("failure"):
                  print((failure.text or failure.get("message", ""))[:6000])
          PYTEST
